<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC2Free Member Directory</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 { text-align: center; color: #1a1a1a; }
        
        /* Form Styling */
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd0d5;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .form-group textarea { height: 80px; resize: vertical; }
        .form-help {
            font-size: 0.8rem;
            color: #586069;
            margin-top: 3px;
        }
        .submit-btn {
            background-color: #24292e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover { background-color: #000; }

        /* Directory Grid Layout */
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .member-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
        }
        .member-name { margin: 0 0 10px 0; font-size: 1.3rem; color: #24292e; }
        .member-bio { font-size: 0.95rem; color: #586069; line-height: 1.5; margin-bottom: 15px; }
        
        .btn {
            display: inline-block;
            padding: 8px 12px;
            font-size: 0.85rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 5px;
        }
        .btn-freecycle { background-color: #3f681c; color: white; }
        .btn-btc { background-color: #f7931a; color: white; cursor: pointer; border: none; }
        .status-msg { text-align: center; font-size: 1.2rem; color: #666; margin-top: 30px; }
    </style>
</head>
<body>

    <!-- 1. SUBMISSION FORM -->
    <div class="form-container">
        <h2>Submit Your Profile Details</h2>
        <form id="prefillForm">
            <div class="form-group">
                <label for="web_url">Freecycle Member URL</label>
                <input type="url" id="web_url" placeholder="https://freecycle.org" required>
                <div class="form-help">Must start with your exact profile prefix.</div>
            </div>
            <div class="form-group">
                <label for="web_btc">Bitcoin Address</label>
                <input type="text" id="web_btc" placeholder="e.g., bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh" required>
            </div>
            <button type="submit" class="submit-btn">🚀 Prepare Submission via GitHub</button>
        </form>
    </div>

    <hr style="border: 0; border-top: 1px solid #d1d5da; margin: 40px 0;">

    <!-- 2. MEMBERS DIRECTORY -->
    <h2>Verified Members Directory</h2>
    <div id="directory" class="directory-grid">
        <div class="status-msg" id="status">Loading members database...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Replace these with your exact GitHub Username and Repository Name
        const GITHUB_USERNAME = 'TheButterZone';
        const REPO_NAME = 'thebutterzone.github.io';
        // ---------------------

        // Handle the website form submission
        document.getElementById('prefillForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Gather inputs from the webpage form
            const name = document.getElementById('web_name').value;
            const url = document.getElementById('web_url').value;
            const btc = document.getElementById('web_btc').value;
            const bio = document.getElementById('web_bio').value;

            // Map the web elements directly to the IDs used inside your submit-info.yml form
            const githubIssueUrl = `https://github.com{GITHUB_USERNAME}/${REPO_NAME}/issues/new` +
                `?template=submit-info.yml` +
                `&name=${encodeURIComponent(name)}` +
                `&website=${encodeURIComponent(url)}` +
                `&bitcoin_address=${encodeURIComponent(btc)}` +
                `&bio=${encodeURIComponent(bio)}`;

            // Open the pre-filled GitHub page in a new window tab
            window.open(githubIssueUrl, '_blank');
        });

        // Pull the stored array database from data.json to populate the directory below
        fetch('./data.json')
            .then(response => {
                if (!response.ok) throw new Error('Database empty or missing.');
                return response.json();
            })
            .then(members => {
                const directoryContainer = document.getElementById('directory');
                directoryContainer.innerHTML = '';

                if (members.length === 0) {
                    directoryContainer.innerHTML = '<div class="status-msg">No approved members yet!</div>';
                    return;
                }

                members.forEach(member => {
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <a href="${escapeHTML(member.url)}" target="_blank" rel="noopener" class="btn btn-freecycle">Freecycle Profile</a>
                        <button class="btn btn-btc" onclick="copyBTC('${escapeHTML(member.bitcoin)}')">📋 Copy BTC</button>
                    `;
                    directoryContainer.appendChild(card);
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('status').innerText = 'Failed to load member records.';
            });

        function copyBTC(address) {
            navigator.clipboard.writeText(address).then(() => {
                alert('Bitcoin address copied:\n' + address);
            }).catch(() => {
                alert('Address text:\n' + address);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
