<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC2Free Member Directory</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 { text-align: center; color: #1a1a1a; }
        
        /* Form Styling */
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd0d5;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .form-group textarea { height: 80px; resize: vertical; }
        .form-help {
            font-size: 0.8rem;
            color: #586069;
            margin-top: 3px;
        }
        .submit-btn {
            background-color: #24292e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover { background-color: #000; }

        /* Directory Grid Layout */
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .member-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
        }
        .member-url { margin: 0 0 10px 0; font-size: 1.3rem; color: #24292e; }
        .member-btc { font-size: 0.95rem; color: #586069; line-height: 1.5; margin-bottom: 15px; }
        
        .btn {
            display: inline-block;
            padding: 8px 12px;
            font-size: 0.85rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 5px;
        }
        .btn-freecycle { background-color: #3f681c; color: white; }
        .btn-btc { background-color: #f7931a; color: white; cursor: pointer; border: none; }
        .status-msg { text-align: center; font-size: 1.2rem; color: #666; margin-top: 30px; }
    </style>
</head>
<body>

<script>
window.APP_CONFIG = {
  GITHUB_USERNAME: 'TheButterZone',
  REPO_NAME: 'thebutterzone.github.io',
  BASE_ISSUES_URL:
    'https://github.com/TheButterZone/thebutterzone.github.io/issues/new'
};
</script>

    <!-- 1. SUBMISSION FORM -->
<div class="form-container">
    <h2>Submit Your Profile Details</h2>
    <form id="prefillForm">
        <div class="form-group">
    <label for="web_username">Freecycle Username</label>
    <input 
        type="text" 
        id="web_username" 
        placeholder="e.g., your_username+12" 
        pattern="[a-zA-Z0-9\+\-]+"
        title="Username can only contain letters, numbers, plus signs (+), or minus signs (-)"
        required
    >
    <div class="form-help">Enter just your username (letters, numbers, + and - symbols allowed).</div>
</div>
        <div class="form-group">
            <label for="web_btc">Bitcoin Address</label>
            <!-- Added a strict pattern attribute checking for Legacy, SegWit, or Taproot structures -->
            <input 
                type="text" 
                id="web_btc" 
                placeholder="e.g., bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh" 
                pattern="^(1[a-km-zA-HJ-NP-Z1-9]{25,34}|3[a-km-zA-HJ-NP-Z1-9]{25,34}|bc1[a-zA-Z0-9]{25,39}|bc1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{39,59})$"
                title="Please enter a valid Legacy (1...), Nested SegWit (3...), or Native SegWit (bc1...) Bitcoin address."
                required
            >
        </div>
        <button type="submit" class="submit-btn">🚀 Prepare Submission via GitHub</button>
    </form>
</div>

<script>
document.getElementById("prefillForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const username = document.getElementById("web_username").value.trim();
    const btc = document.getElementById("web_btc").value.trim();

    // Build the clean submission path using your verified string concatenation logic
    const url = `${window.APP_CONFIG.BASE_ISSUES_URL}?template=submit-info.yml`
      + "&username=" + encodeURIComponent(username) 
      + "&bitcoin=" + encodeURIComponent(btc);
   
    window.open(url, "_blank", "noopener,noreferrer");
});
</script>

    <hr style="border: 0; border-top: 1px solid #d1d5da; margin: 40px 0;">

    <!-- 2. MEMBERS DIRECTORY -->
    <h2>Verified Members Directory</h2>
    <div id="directory" class="directory-grid">
        <div class="status-msg" id="status">Loading members database...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
const { GITHUB_USERNAME, REPO_NAME } = window.APP_CONFIG;

        // Pull the stored array database from data.json to populate the directory below
        fetch('./data.json')
            .then(response => {
                if (!response.ok) throw new Error('Database empty or missing.');
                return response.json();
            })
            .then(members => {
                const directoryContainer = document.getElementById('directory');
                directoryContainer.innerHTML = '';

                if (members.length === 0) {
                    directoryContainer.innerHTML = '<div class="status-msg">No approved members yet!</div>';
                    return;
                }

                members.forEach(member => {
    const card = document.createElement('div');
    card.className = 'member-card';
    
    // Extract just the username from the end of the stored URL string
    // This splits the URL by slashes and grabs the very last piece
const username = (member.username || "").trim();
if (!username) return;

const freecycleUrl =
  "https://freecycle.org/member/" +
  encodeURIComponent(username);

    // Build the clean removal path using your verified string concatenation logic
    const url = `${window.APP_CONFIG.BASE_ISSUES_URL}?template=remove-info.yml`
      + "&username=" + encodeURIComponent(username) 

    card.innerHTML = `
        <p style="margin: 0 0 15px 0; font-weight: bold; color: #24292e;">Verified Directory Entry</p>
        <a href="${freecycleUrl}" target="_blank" rel="noopener" class="btn btn-freecycle">Freecycle Profile</a>
        <button class="btn btn-btc"
            onclick='processBitcoin(${JSON.stringify(member.bitcoin)})'>
            📋 Open Wallet & Copy BTC
        </button>
        
        <!-- UPDATED REMOVAL BUTTON USING JUST USERNAME -->
        <a href="${removalUrl}" target="_blank" rel="noopener" class="btn" style="background-color: #cb2431; color: white; margin-top: 10px; display: block; text-align: center;">⚠️ Remove My Entry</a>
    `;
    directoryContainer.appendChild(card);
});
            })
            .catch(error => {
                console.error(error);
                document.getElementById('status').innerText = 'Failed to load member records.';
            });
<script>
function processBitcoin(address) {
    if (!address) return;

    // Copy BTC address
    navigator.clipboard.writeText(address)
        .then(() => {
            console.log("Copied BTC address:", address);
        })
        .catch(err => {
            console.error("Clipboard failed:", err);
        });

    // Open wallet handler
    window.location.href = "bitcoin:" + address;
}

function escapeHTML(str) {
    return String(str || "").replace(/[&<>'"]/g, function(tag) {
        const chars = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        };

        return chars[tag] || tag;
    });
}
</script>
    
</body>
</html>
