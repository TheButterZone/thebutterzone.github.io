name: BTC Incoming Payment Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# -----------------------------
# GLOBAL LOCK (CRITICAL)
# -----------------------------
concurrency:
  group: btc-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  btc-monitor:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repo
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Run BTC monitor
      # -----------------------------
      - name: Run BTC monitor
        run: node scripts/check-btc.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: false

      # -----------------------------
      # Commit state update
      # -----------------------------
      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .btc-monitor-state.json

          git diff --cached --quiet || git commit -m "Update BTC monitor state"

          git push
