name: BTC Monitor

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    concurrency:
      group: btc-monitor
      cancel-in-progress: true

    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/run-btc-test') &&
        github.event.comment.user.login == 'TheButterZone'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run BTC monitor
        run: node scripts/check-btc.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'issue_comment' }}
          TEST_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}

      - name: Commit BTC monitor state
        run: |
          if [ ! -f .btc-monitor-state.json ]; then
            echo "No state file present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .btc-monitor-state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update BTC monitor state"
          git push
