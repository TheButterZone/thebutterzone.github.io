name: BTC Monitor

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # manual trigger
  issue_comment:
    types: [created]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt into Node 24 early
  CONCURRENCY_GROUP: "btc-monitor"           # concurrency lock

jobs:
  monitor:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ env.CONCURRENCY_GROUP }}
      cancel-in-progress: true

    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/run-btc-test') &&
        github.event.comment.user.login == 'TheButterZone'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run BTC monitor
        run: node scripts/check-btc.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'issue_comment' }}
