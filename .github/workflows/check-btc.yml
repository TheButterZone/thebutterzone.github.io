name: BTC Incoming Payment Monitor

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:      # manual trigger

jobs:
  btc-monitor:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repo
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -----------------------------
      # Restore cached BTC state
      # -----------------------------
      - name: Restore BTC state cache
        uses: actions/cache@v3
        with:
          path: .btc-monitor-state.json
          key: btc-state-${{ runner.os }}

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Run BTC monitor (TEST_MODE optional)
      # -----------------------------
      - name: Run BTC monitor
        run: node scripts/check-btc.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: false   # <-- flip to true for safe simulation
