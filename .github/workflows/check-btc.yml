name: BTC Monitor

on:
  schedule:
    - cron: "21 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ensures all action JS runs on Node 24

jobs:
  monitor:
    runs-on: ubuntu-latest

    concurrency:
      group: btc-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Run BTC monitor
        run: node scripts/check-btc.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit BTC monitor state
        run: |
          if [ ! -f .btc-monitor-state.json ]; then
            echo "No state file present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .btc-monitor-state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update BTC monitor state"
          git push
