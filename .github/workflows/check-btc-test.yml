name: BTC Monitor Test

on:
  schedule:
    # Runs every minute for testing
    - cron: "* * * * *"
  workflow_dispatch: # manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor-test:
    runs-on: ubuntu-latest
    concurrency:
      group: btc-monitor-test
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Run BTC monitor test
        run: |
          echo "[INFO] BTC Monitor test run started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/check-btc.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: true
