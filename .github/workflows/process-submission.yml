name: Process Website Directory (With Approval)
on:
  issues:
    types: [labeled]

# Fix: Force the runner to use Node 24 to completely remove the deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Submission Form
        id: parse_add
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml

      - name: Parse Removal Form
        id: parse_remove
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/remove-info.yml

      - name: Process Directory Changes
        run: |
          set -e

          # Extract and clean inputs
          URL=$(echo '${{ steps.parse_add.outputs.issueparser_website }}' | tr -d '[:space:]')
          BTC_ADDRESS=$(echo '${{ steps.parse_add.outputs.issueparser_bitcoin_address }}' | tr -d '[:space:]')
          BTC_CHECK=$(echo '${{ steps.parse_add.outputs.issueparser_bitcoin_address }}' | tr -d '[:space:]')

          if [ ! -f data.json ]; then
            echo "[]" > data.json
          fi

          # Fix: Used standard string length test (-n) to avoid syntax crashes in Ubuntu Bash
          if [ -n "$BTC_CHECK" ]; then
            echo "--- PROCESSING ADDITION ---"
            
            FREECYCLE_REGEX="^https:\/\/www\.freecycle\.org\/member\/[a-zA-Z0-9\+\-]+$"
            if [[ ! "$URL" =~ $FREECYCLE_REGEX ]]; then
              echo "ERROR_MSG=The Freecycle URL provided does not match the required format." >> $GITHUB_ENV
              exit 1
            fi

            BTC_REGEX="^(1[a-km-zA-HJ-NP-Z1-9]{25,34}|3[a-km-zA-HJ-NP-Z1-9]{25,34}|bc1[a-zA-Z0-9]{25,39}|bc1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{39,59})$"
            if [[ ! "$BTC_ADDRESS" =~ $BTC_REGEX ]]; then
              echo "ERROR_MSG=The Bitcoin address provided is invalid." >> $GITHUB_ENV
              exit 1
            fi

            jq --arg url "$URL" --arg btc "$BTC_ADDRESS" \
              '. += [{"url": $url, "bitcoin": $btc}]' data.json > tmp.json && mv tmp.json data.json

          else
            echo "--- PROCESSING REMOVAL ---"
            USERNAME=$(echo '${{ steps.parse_remove.outputs.issueparser_username }}' | tr -d '[:space:]')
            TARGET_URL="https://freecycle.org"
            
            jq --arg target "$TARGET_URL" 'del(.[] | select(.url == $target))' data.json > tmp.json && mv tmp.json data.json
          fi

      - name: Handle Validation Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'approved'
              });
            } catch(e) {}
            const errorMsg = process.env.ERROR_MSG || "An unknown validation error occurred inside the workflow processor script.";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Approval Halted:** Input validation failed.\n\n> ${errorMsg}`
            });

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add data.json
          git commit -m "docs: modify website directory records via admin action"
          git push

      - name: Clean Up and Close Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pending-review'
              });
            } catch(e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🎉 **Approved!** The change has been successfully merged and the website directory has updated."
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
