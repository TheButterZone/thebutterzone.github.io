name: Process Submission

permissions:
  contents: write
  issues: write

on:
  issues:
    types: [labeled]

jobs:
  update-data:
    if: github.event.label.name == 'approve'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      # ---------------- DETECT MODE ----------------
      - name: Detect action type
        id: mode
        run: |
          BODY="${{ github.event.issue.body }}"

          if echo "$BODY" | grep -qi "remove"; then
            echo "mode=remove" >> $GITHUB_OUTPUT
          else
            echo "mode=add" >> $GITHUB_OUTPUT
          fi

      # ---------------- PARSE DATA ----------------
      - name: Parse Issue Body
        id: parse
        run: |
          BODY="${{ github.event.issue.body }}"

          USERNAME=$(echo "$BODY" | grep -i "username" | head -n 1 | cut -d':' -f2- | xargs)
          BTC=$(echo "$BODY" | grep -i "bitcoin" | head -n 1 | cut -d':' -f2- | xargs)

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "bitcoin=$BTC" >> $GITHUB_OUTPUT

      # ---------------- PROCESS ----------------
      - name: Process Directory Changes
        run: node scripts/process-directory.js
        env:
          ADD_USERNAME: ${{ steps.parse_add.outputs.issueparser_username }}
          BTC: ${{ steps.parse_add.outputs.issueparser_bitcoin_address }}
          REMOVE_USERNAME: ${{ steps.parse_remove.outputs.issueparser_username }}
      
      # ---------------- READ CHANGE FLAG ----------------
      - name: Read Change Flag
        id: change_flag
        run: echo "changed=$(cat .changed)" >> $GITHUB_OUTPUT

      # ---------------- COMMIT ----------------
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json .changed || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update directory data"
          git push

      # ---------------- COMMENT STATUS & CLOSE ----------------
      - name: Comment and Close Issue
        if: steps.change_flag.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;

            const username = `${{ steps.parse_add.outputs.issueparser_username || steps.parse_remove.outputs.issueparser_username }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ Processed successfully.\n\nUser: \`${username}\``
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed"
            });
