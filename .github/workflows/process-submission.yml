name: Process Submission

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  issues:
    types: [labeled]

jobs:
  process:
    if: github.event.label.name == 'approve'
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------- NODE 24 ONLY ----------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------------- PARSE ISSUE BODY ----------------
      - name: Parse Issue Body
        id: parse
        run: |
          BODY=$(cat <<'EOF'
          ${{ github.event.issue.body }}
          EOF
          )

          USERNAME=$(echo "$BODY" | awk '/### Freecycle Username/{getline; getline; print}' | xargs)

          BTC=$(echo "$BODY" | awk '/### Bitcoin Address/{getline; getline; print}' | xargs)

          echo "USERNAME=$USERNAME"
          echo "BTC=$BTC"

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "bitcoin=$BTC" >> $GITHUB_OUTPUT

      # ---------------- DETERMINE MODE ----------------
      - name: Detect mode
        id: mode
        run: |
          if [ -n "${{ steps.parse.outputs.username }}" ] && [ -n "${{ steps.parse.outputs.bitcoin }}" ]; then
            echo "mode=add" >> $GITHUB_OUTPUT
          else
            echo "mode=remove" >> $GITHUB_OUTPUT
          fi

      # ---------------- NORMALIZED PROCESSING ----------------
      - name: Process Directory Changes
        run: node scripts/process-directory.js
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          USERNAME: ${{ steps.parse.outputs.username }}
          BTC: ${{ steps.parse.outputs.bitcoin }}
          GITHUB_USER: ${{ github.event.issue.user.login }}

      # ---------------- UNAUTHORIZED REMOVE ----------------
      - name: Reject Unauthorized Removal
        if: hashFiles('.unauthorized') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body:
                "❌ Removal denied.\n\nOnly the original GitHub submitter may remove this entry."
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed"
            });

            core.setFailed("Unauthorized removal attempt.");

      # ---------------- DEBUG ----------------
      - name: Debug output
        run: |
          echo "==== data.json ===="
          cat data.json || true

          echo "==== .changed ===="
          cat .changed || true

      # ---------------- COMMIT ----------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json .changed || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update directory"
          git push

      # ---------------- COMMENT + CLOSE ----------------
      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "✅ Processed successfully and updated directory."
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed"
            });
