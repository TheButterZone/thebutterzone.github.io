name: Process Website Directory

on:
  issues:
    types: [labeled]

jobs:
  update-data:
    if: github.event.label.name == 'approved'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Parse Submission Form
        id: parse_add
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml

      - name: Process Directory Changes
        run: node scripts/process-directory.js
        env:
          ADD_USERNAME: ${{ steps.parse_add.outputs.issueparser_username }}
          BTC: ${{ steps.parse_add.outputs.issueparser_bitcoin_address }}
          REMOVE_USERNAME: ${{ github.event.issue.body }}
      
      - name: Check if changes occurred
        id: changes
        run: echo "changed=$(cat .changed)" >> $GITHUB_OUTPUT
      
      - name: Clean Up and Close Issue
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed"
            });
