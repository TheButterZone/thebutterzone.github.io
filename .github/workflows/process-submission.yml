name: Process Website Directory (With Approval)

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Run Processing Script
        run: npm start

      - name: Parse Submission Form
        id: parse_add
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml

      - name: Parse Removal Form
        id: parse_remove
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/remove-info.yml

      - name: Ensure data.json exists
        run: |
          if [ ! -f data.json ]; then
            echo "[]" > data.json
          fi

      - name: Process Directory Changes
        run: |
          set -e

          URL=$(echo '${{ steps.parse_add.outputs.issueparser_website }}' | xargs)
          BTC_ADDRESS=$(echo '${{ steps.parse_add.outputs.issueparser_bitcoin_address }}' | xargs)
          USERNAME=$(echo '${{ steps.parse_remove.outputs.issueparser_username }}' | xargs)

          if [ -n "$BTC_ADDRESS" ]; then
            echo "--- PROCESSING ADDITION ---"

            jq --arg url "$URL" --arg btc "$BTC_ADDRESS" \
              '. += [{"url": $url, "bitcoin": $btc}]' \
              data.json > tmp.json

            mv tmp.json data.json

          elif [ -n "$USERNAME" ]; then
            echo "--- PROCESSING REMOVAL ---"

            jq --arg target "$USERNAME" \
              'del(.[] | select(.url == $target))' \
              data.json > tmp.json

            mv tmp.json data.json
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "docs: modify website directory records via admin action"

          git push

      - name: Clean Up and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pending-review'
              });
            } catch (e) {}

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ Approved! The website directory has been updated."
            });

            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
