name: Process Submission

permissions:
  contents: write
  issues: write

on:
  issues:
    types: [labeled]

jobs:
  process:
    if: github.event.label.name == 'approve'
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------- NODE 24 ONLY ----------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------------- PARSE ISSUE FORM (ONLY SOURCE OF TRUTH) ----------------
      - name: Parse Issue
        id: parse
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml

      - name: Parse Remove Issue
        id: parse_remove
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/remove-info.yml

      # ---------------- DETERMINE MODE ----------------
      - name: Detect mode
        id: mode
        run: |
          if [ -n "${{ steps.parse.outputs.username }}" ] && [ -n "${{ steps.parse.outputs.bitcoin }}" ]; then
            echo "mode=add" >> $GITHUB_OUTPUT
          else
            echo "mode=remove" >> $GITHUB_OUTPUT
          fi

      # ---------------- NORMALIZED PROCESSING ----------------
      - name: Run directory script
        run: node scripts/process-directory.js
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          USERNAME: ${{ steps.parse.outputs.username || steps.parse_remove.outputs.username }}
          BTC: ${{ steps.parse.outputs.bitcoin }}

      # ---------------- DEBUG ----------------
      - name: Debug output
        run: |
          echo "==== data.json ===="
          cat data.json || true

          echo "==== .changed ===="
          cat .changed || true

      # ---------------- COMMIT ----------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json .changed || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update directory"
          git push

      # ---------------- COMMENT + CLOSE ----------------
      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "✅ Processed successfully and updated directory."
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed"
            });
