name: Process Website Directory

on:
  issues:
    types: [labeled]

jobs:
  update-data:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Parse Submission Form
        id: parse_add
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml

      - name: Parse Removal Form
        id: parse_remove
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/remove-info.yml

      - name: Ensure data.json exists
        run: |
          if [ ! -f data.json ]; then
            echo "[]" > data.json
          fi

      - name: Process Directory Changes
        run: node scripts/process-directory.js
        env:
          ADD_USERNAME: ${{ steps.parse_add.outputs.issueparser_username }}
          BTC: ${{ steps.parse_add.outputs.issueparser_bitcoin_address }}
          REMOVE_USERNAME: ${{ steps.parse_remove.outputs.issueparser_username }}

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update website directory"
          git push origin HEAD:${{ github.ref_name }}

      - name: Clean Up and Close Issue
        uses: actions/github-script@v6
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pending-review'
              });
            } catch (e) {}

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Approved! The website directory has been updated.'
            });

            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
