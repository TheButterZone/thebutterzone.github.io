name: Process Website Directory

on:
  issues:
    types: [labeled]

jobs:
  update-data:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ---------------- ADD PARSING ----------------
      - name: Parse Submission
        id: parse_add
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml
      
      - name: Parse Removal
        id: parse_remove
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/remove-info.yml

      # --------  (KEEP YOUR REGEX VALIDATION HERE --------
      - name: Validate Inputs
        run: |
          node -e "
          const username = '${{ steps.parse_add.outputs.issueparser_username }}';
          const btc = '${{ steps.parse_add.outputs.issueparser_bitcoin_address }}';
      
          const usernameRegex = /^[a-zA-Z0-9_-]{3,20}$/;
          const btcRegex = /^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,39}$/;
      
          if (username && !usernameRegex.test(username)) {
            console.error('Invalid username');
            process.exit(1);
          }
      
          if (btc && !btcRegex.test(btc)) {
            console.error('Invalid BTC address');
            process.exit(1);
          }
          "

                  - name: DEBUG REMOVE INPUT
          run: |
            echo "RAW ISSUE BODY:"
            echo "${{ github.event.issue.body }}"
        
            echo "PARSED REMOVE USERNAME:"
            echo "${{ steps.parse_remove.outputs.issueparser_username }}"

      # ---------------- PROCESS ----------------
      - name: Process Directory Changes
        run: node scripts/process-directory.js
        env:
          ADD_USERNAME: ${{ steps.parse_add.outputs.issueparser_username }}
          BTC: ${{ steps.parse_add.outputs.issueparser_bitcoin_address }}
          REMOVE_USERNAME: ${{ github.event.issue.body }}

      # ---------------- READ CHANGE FLAG ----------------
      - name: Read change state
        id: changes
        run: echo "changed=$(cat .changed)" >> $GITHUB_OUTPUT

      # ---------------- COMMIT ----------------
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update directory"
          git push origin HEAD:${{ github.ref_name }}

      # ---------------- CLOSE ONLY IF CHANGED ----------------
      - name: Close Issue
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed"
            });
