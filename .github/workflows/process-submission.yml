name: Process Submission

on:
  issues:
    types: [labeled]

jobs:
  update-data:
    if: github.event.label.name == 'approve'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      # ---------------- DETECT MODE ----------------
      - name: Detect action type
        id: mode
        run: |
          BODY="${{ github.event.issue.body }}"

          if echo "$BODY" | grep -qi "remove"; then
            echo "mode=remove" >> $GITHUB_OUTPUT
          else
            echo "mode=add" >> $GITHUB_OUTPUT
          fi

      # ---------------- PARSE DATA ----------------
      - name: Parse Issue Body
        id: parse
        run: |
          BODY="${{ github.event.issue.body }}"

          USERNAME=$(echo "$BODY" | grep -i "username" | head -n 1 | cut -d':' -f2- | xargs)
          BTC=$(echo "$BODY" | grep -i "bitcoin" | head -n 1 | cut -d':' -f2- | xargs)

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "bitcoin=$BTC" >> $GITHUB_OUTPUT

      # ---------------- PROCESS ----------------
      - name: Process Directory Changes
        id: process
        run: node scripts/process-directory.js
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          USERNAME: ${{ steps.parse.outputs.username }}
          BTC: ${{ steps.parse.outputs.bitcoin }}

      # ---------------- COMMIT ----------------
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json .changed || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update directory data"
          git push

      # ---------------- COMMENT STATUS ----------------
      - name: Comment on Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ Processed successfully.

            Mode: `${{ steps.mode.outputs.mode }}`
            User: `${{ steps.parse.outputs.username }}`
