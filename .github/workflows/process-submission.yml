name: Process Submission

on:
  issues:
    types: [labeled]

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repo
        uses: actions/checkout@v5

      # ---------------- NODE 24 ----------------
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      # ---------------- PARSE ADD ----------------
      - name: Parse Submission
        id: parse_add
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-info.yml

      # ---------------- PARSE REMOVE ----------------
      - name: Parse Removal
        id: parse_remove
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/remove-info.yml

      # ---------------- PROCESS DATA ----------------
      - name: Process Directory Changes
        run: node scripts/process-directory.js
        env:
          ADD_USERNAME: ${{ steps.parse_add.outputs.issueparser_username }}
          BTC: ${{ steps.parse_add.outputs.issueparser_bitcoin_address }}
          REMOVE_USERNAME: ${{ steps.parse_remove.outputs.issueparser_username }}

      # ---------------- COMMIT CHANGES ----------------
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json .changed || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update directory data"
          git push
