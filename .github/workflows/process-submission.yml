name: Process Submission

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  issues:
    types: [labeled]

jobs:
  # ---------------- JOB 1: PROCESS & BUILD ----------------
  process:
    if: github.event.label.name == 'approve'
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Parse Issue Body
        id: parse
        run: |
          BODY=$(cat <<'EOF'
          ${{ github.event.issue.body }}
          EOF
          )
          USERNAME=$(echo "$BODY" | awk '/### Freecycle.org Username/{getline; getline; print}' | xargs)
          BTC=$(echo "$BODY" | awk '/### Bitcoin Address/{getline; getline; print}' | xargs)

          echo "USERNAME=$USERNAME"
          echo "BTC=$BTC"

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "bitcoin=$BTC" >> $GITHUB_OUTPUT

      - name: Detect mode
        id: mode
        run: |
          if [ -n "${{ steps.parse.outputs.username }}" ] && [ -n "${{ steps.parse.outputs.bitcoin }}" ]; then
            echo "mode=add" >> $GITHUB_OUTPUT
          else
            echo "mode=remove" >> $GITHUB_OUTPUT
          fi

      - name: Process Directory Changes
        run: node scripts/process-directory.cjs
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          USERNAME: ${{ steps.parse.outputs.username }}
          BTC: ${{ steps.parse.outputs.bitcoin }}
          GITHUB_USER: ${{ github.event.issue.user.login }}

      - name: Reject Unauthorized Removal
        if: hashFiles('.unauthorized') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: "❌ Removal denied.\n\nOnly the original GitHub submitter may remove this entry."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              state: "closed"
            });
            core.setFailed("Unauthorized removal attempt.");

      - name: Debug output
        run: |
          echo "==== data.json ===="
          cat data.json || true
          echo "==== .changed ===="
          cat .changed || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json .changed || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update directory"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.' 

      # ---------------- FAILURE HANDLER FOR JOB 1 ----------------
      - name: Handle Processing Failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const issue_number = context.issue.number;
            const run_id = context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `⚠️ **Workflow Error:** Processing your directory submission or generating the web files failed.\n\nThe issue remains open.\n\nWorkflow run ID: ${run_id}`
            });

  # ---------------- JOB 2: DEPLOY & CLOSE ISSUE ----------------
  deploy:
    needs: process
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Comment + Close issue
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const issue_number = ${{ needs.process.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: "✅ Processed successfully and updated directory."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              state: "closed"
            });

      # ---------------- FAILURE HANDLER FOR JOB 2 ----------------
      - name: Handle Deployment Failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const issue_number = ${{ needs.process.outputs.issue_number }};
            const run_id = context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `⚠️ **Deployment Error:** Your data was updated in the repository, but publishing it live to GitHub Pages failed.\n\nThe issue remains open.\n\nWorkflow run ID: ${run_id}`
            });
